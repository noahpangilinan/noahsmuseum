[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Content files are not fingerprinted, so let them revalidate rather than cache forever.
[[headers]]
  for = "/art/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/rooms/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

# Vite's hashed bundles never change.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
